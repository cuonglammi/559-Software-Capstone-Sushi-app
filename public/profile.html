<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - Sushi Order</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>🍣 My Profile</h1>
    <nav aria-label="Main">
      <a href="/dashboard.html">Server dashboard</a>
      <a href="/kitchen.html">Kitchen queue</a>
      <button id="logout-btn" type="button">Log out</button>
    </nav>
  </header>
  <main>
    <div id="msg" class="alert" hidden role="alert"></div>

    <div class="card narrow">
      <h2>Profile</h2>
      <p><strong>Username:</strong> <span id="p-username"></span></p>
      <p><strong>Role:</strong> <span id="p-role"></span></p>
      <form id="name-form" novalidate>
        <label for="full-name">Full name</label>
        <input id="full-name" type="text" maxlength="100" autocomplete="name" required>
        <button class="primary" type="submit">Save name</button>
      </form>
    </div>

    <div class="card narrow">
      <h2>Change password</h2>
      <p class="hint">At least 8 characters with an uppercase letter, a lowercase letter, a number, and a special character.</p>
      <form id="password-form" novalidate>
        <label for="current-password">Current password</label>
        <input id="current-password" type="password" autocomplete="current-password" required>
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" required>
        <button class="primary" type="submit">Change password</button>
      </form>
    </div>
  </main>
  <footer class="site-footer">Sushi Order Application — Software Capstone</footer>
  <script src="/js/common.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
